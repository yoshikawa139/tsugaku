<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#12161C"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.svg"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>通学ダイヤ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a station departure board; route timeline is the core object. */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #12161C;
  --muted: #5B6573;
  --rule: #D5DBE2;
  --accent: #1C4FD8;
  --accent-ink: #FFFFFF;
  --go: #E8683D;
  --sel: #B98300;
  --sel-ink: #FFFFFF;
  --warn: #B45309;
  --warn-bg: #FEF3C7;
  --ok: #047857;
  --bad: #B91C1C;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1217; --surface: #171C23; --ink: #E7ECF2; --muted: #96A1AF; --rule: #2A323C;
  --accent: #7AA2FF; --accent-ink: #0E1217; --warn: #FBBF24; --warn-bg: #3A2C0B; --ok: #34D399; --bad: #F87171;
  --sel: #F5BE0B; --sel-ink: #17130A;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1217; --surface: #171C23; --ink: #E7ECF2; --muted: #96A1AF; --rule: #2A323C;
  --accent: #7AA2FF; --accent-ink: #0E1217; --warn: #FBBF24; --warn-bg: #3A2C0B; --ok: #34D399; --bad: #F87171;
  --sel: #F5BE0B; --sel-ink: #17130A;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
header.top .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 0; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
.brand h1 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 700; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs a { flex: 1 0 auto; text-align: center; text-decoration: none; color: var(--muted); padding: 8px 10px 9px; font-size: 13px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }

main .wrap { padding-block: 16px 120px; display: flex; flex-direction: column; gap: 16px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.banner b { color: inherit }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 15px; margin: 0; }
.panel p { margin: 0; }
.hint { color: var(--muted); font-size: 12.5px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea, input.inp { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; font-size: 15px; color: var(--ink); min-width: 0; }
textarea { width: 100%; min-height: 160px; font-family: var(--font-num); font-size: 13px !important; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

/* search results */
.opt { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.opt > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
.opt > summary::-webkit-details-marker { display: none }
.opt-times { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.opt-times .arrow { color: var(--muted); font-weight: 500; margin: 0 6px; }
.opt-dur { text-align: right; font-size: 13px; color: var(--muted); }
.opt-sub { font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.opt-sub .cd { color: var(--accent); font-weight: 700; }
.opt-sub .tight { color: var(--bad); font-weight: 700; }
.opt[open] > summary { border-bottom: 1px solid var(--rule); }
.tl { padding: 6px 14px 14px; display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 52px 18px 1fr; column-gap: 8px; }
.stop .t { text-align: right; font-size: 14px; font-weight: 600; padding-top: 1px; }
.stop .t small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.stop .dot { position: relative; }
.stop .dot::before { content: ""; position: absolute; left: 3px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); }
.stop .name { font-weight: 700; font-size: 15px; }
.stop .xf { font-size: 12.5px; color: var(--muted); }
.stop .xf .slack { font-weight: 700; }
.ride { display: grid; grid-template-columns: 52px 18px 1fr; column-gap: 8px; }
.ride .bar { display: flex; justify-content: center; }
.ride .bar i { width: 6px; border-radius: 3px; background: var(--c); margin-block: 2px; }
.ride .body { padding-block: 6px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.line-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.line-chip i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); flex: none; }
.pos { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; border: 1px dashed var(--rule); border-radius: 8px; padding: 6px 8px; }
.pos b { font-family: var(--font-num); }
.pos.unset { color: var(--muted); }
/* timetable grid */
.legs { display: flex; flex-wrap: wrap; gap: 6px; }
.legs button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
.legs button i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.legs button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 700; }
.grid-scroll { overflow-x: auto; }
table.tt { border-collapse: collapse; width: 100%; font-size: 13px; }
table.tt th { width: 34px; text-align: right; padding: 4px 8px 4px 0; border-right: 2px solid var(--ink); font-family: var(--font-num); vertical-align: top; }
table.tt td { padding: 4px 0 4px 8px; border-bottom: 1px solid var(--rule); }
table.tt td span { display: inline-block; min-width: 2.2em; margin-right: 4px; font-family: var(--font-num); }
table.tt td span sup { font-family: var(--font-body); font-size: 9.5px; color: var(--muted); margin-left: 1px; }
table.links th, table.links td { width: auto; border-right: 0; padding: 4px 8px; text-align: left; font-family: var(--font-num); font-size: 12.5px; white-space: nowrap; }
table.links thead th { color: var(--muted); font-family: var(--font-body); font-weight: 500; border-bottom: 1px solid var(--rule); }
table.links td.arrow { color: var(--muted); padding: 4px 2px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.badge.sample { color: var(--warn); }
.badge.real { color: var(--ok); }

/* transfer editor */
.route-ed { display: flex; flex-direction: column; gap: 0; }
.ed-item { display: grid; grid-template-columns: 18px 1fr; column-gap: 10px; }
.ed-item .bar { display: flex; justify-content: center; }
.ed-item .bar i { width: 6px; background: var(--c, var(--rule)); border-radius: 3px; }
.ed-item .bar.st { position: relative; }
.ed-item .bar.st::before { content: ""; position: absolute; top: 14px; left: 1px; width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--ink); background: var(--surface); }
.ed-body { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ed-body h3 { font-size: 14px; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.pair .field input { width: 100%; }
.tag-prov { font-size: 11px; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; font-weight: 700; }

.src li { margin-bottom: 6px; }
.src a { color: var(--accent); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 9; }
@media (prefers-reduced-motion: no-preference) { .opt > summary { transition: background .15s } }
#tt-grid { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
#tt-grid .tt-t { cursor: pointer; border-radius: 4px; }
#tt-grid .tt-t.on { box-shadow: 0 0 0 1.5px var(--ink); }
table.tt.hd th { color: var(--bad); border-right-color: var(--bad); }
table.status tr.sp td { height: 14px; padding: 0; border-bottom: 0; }
.sbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.rbar { padding: 12px 12px 18px; display: flex; flex-direction: column; gap: 14px; }
.rbar-top { display: flex; align-items: center; gap: 4px; }
.ico { flex: none; width: 30px; height: 34px; padding: 2px; border: 0; background: transparent; color: var(--ink); border-radius: 8px; display: grid; place-items: center; }
.ico svg { width: 25px; height: 25px; }
.ico.swap { color: var(--sel); width: 26px; }
.ico:active { background: var(--bg); }
.rpill { flex: 1 1 0; min-width: 0; display: flex; align-items: stretch; border: 1.5px solid var(--sel); border-radius: 6px; overflow: hidden; }
.rpill .lab { flex: none; background: var(--sel); color: var(--sel-ink); font-size: 10.5px; font-weight: 700; padding: 0 4px; display: grid; place-items: center; letter-spacing: .04em; }
.rpill .nm { flex: 1; min-width: 0; text-align: center; color: var(--sel); font-weight: 700; font-size: 15px; padding: 4px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rmap { padding: 0 14px; }
.rm-inner { position: relative; height: 74px; }
.rm-arrow { position: absolute; top: 6px; height: 3px; background: var(--sel); border-radius: 2px; }
.rm-arrow .tail { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; background: var(--sel); transform: translate(-50%, -50%); }
.rm-arrow .head { position: absolute; top: 50%; width: 9px; height: 9px; border-top: 3px solid var(--sel); border-right: 3px solid var(--sel); }
.rm-arrow.east .tail { left: 0; }
.rm-arrow.east .head { right: -1px; transform: translateY(-50%) rotate(45deg); }
.rm-arrow.west .tail { left: 100%; }
.rm-arrow.west .head { left: -1px; transform: translateY(-50%) rotate(-135deg); }
.rm-line { position: absolute; left: 0; right: 0; top: 30px; border-top: 2px dotted var(--muted); }
.rm-node { position: absolute; top: 31px; width: 11px; height: 11px; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); }
.rm-node.thru { background: var(--surface); border: 2px solid var(--ink); width: 13px; height: 13px; }
.rm-node.sel { background: var(--sel); }
.rm-bub { position: absolute; top: 46px; padding: 2px 9px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 700; white-space: nowrap; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.rm-bub i { position: absolute; top: -7px; width: 10px; height: 10px; background: var(--surface); border-left: 1.5px solid var(--ink); border-top: 1.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.rm-bub.drag { border-color: var(--sel); color: var(--sel); cursor: grabbing; }
.rm-bub.drag i { border-color: var(--sel); }
.hero { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 12px; padding: 22px 16px 18px; background: radial-gradient(120% 140% at 50% 0%, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface)); }
.hero-end { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hero-end.r { text-align: right; align-items: flex-end; }
.hero-lab { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
.hero-lab.dep { color: var(--ok); }
.hero-lab.arr { color: var(--bad); }
.hero-name { font-size: 22px; font-weight: 700; letter-spacing: .03em; line-height: 1.2; overflow-wrap: anywhere; }
.hero-track { display: flex; align-items: center; height: 14px; margin-bottom: 7px; position: relative; min-width: 60px; }
.hero-track::before, .hero-track::after { content: ""; flex: none; width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--ink); background: var(--surface); }
.hero-track .seg { flex: 1; height: 4px; background: var(--c); border-radius: 2px; }
.hero-track .node { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin: 0 1px; }
.hero-track .node.thru { background: transparent; border: 1.5px dotted var(--muted); }
.live-chip { min-width: 7.5em; text-align: left; cursor: pointer; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; font-size: 15px; color: var(--ink); }
.sbox-st { display: flex; flex-direction: column; gap: 8px; padding: 14px; }
.pill { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1.5px solid var(--rule); border-radius: 999px; padding: 7px 18px 7px 8px; }
.pill-name { font-size: 20px; font-weight: 500; letter-spacing: .02em; }
.pin { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.pin.dep { color: var(--ok); }
.pin.arr { color: var(--bad); }
.mtabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-top: 1px solid var(--rule); }
.mtabs button { border: 0; background: var(--bg); color: var(--muted); font-size: 17px; padding: 12px 0; font-weight: 500; }
.mtabs button + button { border-left: 1px solid var(--rule); }
.mtabs button[aria-pressed="true"] { background: var(--surface); color: var(--go); font-weight: 700; }
.sbox-body { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.when { display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; background: var(--bg); border: 1.5px solid var(--rule); border-radius: 999px; padding: 12px 40px; font-size: 16px; }
.when .chev { position: absolute; right: 18px; color: var(--muted); }
.optbtn { background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; font-size: 15px; color: var(--muted); }
.gobtn { background: var(--go); color: #fff; border: 0; border-radius: 6px; padding: 13px; font-size: 20px; font-weight: 700; letter-spacing: .1em; }
.dlg { border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(92vw, 380px); }
.dlg::backdrop { background: rgba(0,0,0,.55); }
.dlg-in { display: flex; flex-direction: column; gap: 14px; padding: 18px; }
.dlg-in h2 { margin: 0; font-size: 16px; }
.dlg-act { display: flex; justify-content: flex-end; }
#tt-tip { position: absolute; z-index: 50; background: #fff; color: #111; font-size: 11px; line-height: 1.4; padding: 3px 7px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.25); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
table.status { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 14px; }
table.status th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--rule); }
table.status td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
table.status td:nth-child(3), table.status td:nth-child(4) { font-family: var(--font-num); }
</style>
</head><body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>通学ダイヤ<small id="brand-route"></small></h1>
    </div>
    <nav class="tabs" aria-label="画面">
      <a href="#search" data-view="search">検索</a>
      <a href="#timetable" data-view="timetable">時刻表</a>
      <a href="#transfer" data-view="transfer">乗換・乗車位置</a>
      <a href="#data" data-view="data">データ</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="sample-banner" class="banner" hidden></div>

    <!-- 検索 -->
    <section id="v-search" data-v="search" hidden>
      <div class="sbox">
        <div class="rbar">
          <div class="rbar-top">
            <button id="q-home" class="ico" type="button" aria-label="家へ帰る向きにする" title="帰り"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
            <div class="rpill"><span class="lab">出発</span><span id="q-from" class="nm"></span></div>
            <button id="q-swap" class="ico swap" type="button" aria-label="出発と到着を入れ替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h15M15 4.5l4 4M20 15.5H5M9 19.5l-4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="rpill r"><span id="q-to" class="nm"></span><span class="lab">到着</span></div>
            <button id="q-school" class="ico" type="button" aria-label="大学へ行く向きにする" title="行き"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 20.5h19M4 20.5V12h16v8.5M8 12V9l4-3.2L16 9v3M12 5.8V2.8h2.6M10.3 20.5v-3.6h3.4v3.6M6 14.5h1.6M6 17h1.6M16.4 14.5H18M16.4 17H18M11 10h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
          </div>
          <div id="q-map" class="rmap"></div>
        </div>
        <div class="mtabs" role="group" aria-label="検索方法">
          <button id="mode-dep" type="button">出発</button>
          <button id="mode-arr" type="button">到着</button>
        </div>
        <div class="sbox-body">
          <button id="q-when" class="when" type="button"><span id="q-when-text" class="num"></span><span class="chev" aria-hidden="true">⌄</span></button>
          <button id="q-opt" class="optbtn" type="button">検索設定</button>
          <button id="q-go" class="gobtn" type="button">検索</button>
        </div>
      </div>
      <dialog id="dlg-when" class="dlg">
        <form method="dialog" class="dlg-in">
          <h2>日時</h2>
          <div class="row">
            <input id="q-time" class="inp num" type="time" aria-label="時刻">
            <button id="q-live" class="inp live-chip" type="button" aria-label="時刻を指定する">現在時刻</button>
            <button id="q-now" class="btn small" type="button">現在時刻</button>
          </div>
          <label class="field">ダイヤ
            <select id="q-day" aria-label="ダイヤ">
              <option value="auto">自動（今日の曜日）</option>
              <option value="wd">平日</option>
              <option value="hd">土休日</option>
            </select>
          </label>
          <div class="dlg-act"><button class="btn primary" value="ok">閉じる</button></div>
        </form>
      </dialog>

<div id="tt-tip" hidden></div>
<script>
"use strict";
/* ===== 経路定義 ===== */
// 経路は時刻表パックに入っていればそれを使う（S.route）。無ければこの既定の経路。
const DEFAULT_ROUTE = { stations: ["A駅", "B駅"], lines: [{ name: "A線", prefix: "a" }], through: [] };
const SPARE_COLORS = ["#D6457F", "#E2571E", "#0096C7", "#8463CC", "#2A4FA8", "#0F8A6B", "#B7791F"];
function lineColor(l, i) { return /^#[0-9a-fA-F]{3,8}$/.test(l.color || "") ? l.color : SPARE_COLORS[i % SPARE_COLORS.length]; }
function baseRoute() { return (typeof S !== "undefined" && S && S.route) || DEFAULT_ROUTE; }
function route(dir) {
  const r = baseRoute();
  const lines = r.lines.map((l, i) => ({ ...l, color: lineColor(l, i) }));
  return dir === "out"
    ? { stations: r.stations.slice(), lines, through: new Set(r.through || []) }
    : { stations: r.stations.slice().reverse(), lines: lines.slice().reverse(), through: new Set(r.through || []) };
}
const legCount = () => baseRoute().stations.length - 1;

/* ===== 祝日（土休日ダイヤ判定） ===== */
const HOLIDAYS = new Set([
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06",
  "2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22","2027-04-29","2027-05-03","2027-05-04","2027-05-05",
  "2027-07-19","2027-08-11","2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23",
]);
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function dayTypeOf(date) {
  const md = ymd(date).slice(5);
  if (md >= "12-30" || md <= "01-03") return "hd"; // 年末年始は多くの路線で土休日ダイヤ
  const w = date.getDay();
  return (w === 0 || w === 6 || HOLIDAYS.has(ymd(date))) ? "hd" : "wd";
}

/* ===== 時刻ユーティリティ（秒、3時前は前日扱いで24時以降） ===== */
const pad = n => String(n).padStart(2, "0");
function toSec(s) {
  const m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(String(s).trim());
  if (!m) return NaN;
  let h = +m[1]; if (h < 3) h += 24;
  return h * 3600 + +m[2] * 60 + (+m[3] || 0);
}
function hm(sec) { const h = Math.floor(sec / 3600) % 24, m = Math.floor(sec % 3600 / 60); return `${h}:${pad(m)}`; }

function parseDur(str) {
  str = String(str).trim(); if (!str) return NaN;
  let m = /^(\d+):(\d{1,2})$/.exec(str); if (m) return +m[1] * 60 + +m[2];
  m = /^(?:(\d+)分)?\s*(?:(\d+)秒)?$/.exec(str); if (m && (m[1] || m[2])) return (+m[1] || 0) * 60 + (+m[2] || 0);
  if (/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str) * 60);
  return NaN;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ===== サンプル時刻表（実在のダイヤではありません） ===== */
function genSample() {
  // 架空のサンプル：A駅⇄B駅を10分ごと（土休日は15分ごと）、所要10分
  const tt = {};
  for (const day of ["wd", "hd"]) for (const dir of ["out", "in"]) {
    const o = [];
    for (let t = toSec("6:00"); t <= toSec("23:00"); t += (day === "wd" ? 10 : 15) * 60) o.push({ d: hhmm(t), a: hhmm(t + 600), t: "", to: "" });
    tt[`${dir}:0:${day}`] = o;
  }
  return tt;
}
// 以前の形式（隣の区間と同じidを共有して直通を表す）や id の無い列車を、
// 路線記号＋番号の列車ID（a7, b5 …）と直通の対応表（S.links）に直す。何度呼んでも結果は同じ。
function normalizeTrains() {
  S.links = S.links || {};
  for (const dir of ["out", "in"]) for (const day of ["wd", "hd"]) {
    const { lines } = route(dir), n = legCount(), lk = `${dir}:${day}`;
    const legs = [...Array(n).keys()].map(i => (S.tt[`${dir}:${i}:${day}`] || []).slice().sort((a, b) => toSec(a.d) - toSec(b.d)));
    const pairs = [];
    for (const [x, y] of S.links[lk] || []) pairs.push([x, y]);
    for (let i = 0; i + 1 < n; i++) {
      const ids = new Set(legs[i].map(t => t.id).filter(Boolean));
      for (const t of legs[i + 1]) if (t.id && ids.has(t.id)) pairs.push([`${i}|${t.id}`, `${i + 1}|${t.id}`]);
    }
    // 番号を振り直し、対応表も新しいIDに書き換える
    const ren = new Map();
    legs.forEach((ts, i) => ts.forEach((t, k) => {
      const nid = `${lines[i].prefix || "l" + i}${k + 1}`;
      if (t.id) { ren.set(`${i}|${t.id}`, nid); if (!ren.has(t.id)) ren.set(t.id, nid); }
      t.id = nid;
    }));
    const seen = new Set(), out = [];
    for (const [x, y] of pairs) {
      const a = ren.get(x) || x, b = ren.get(y) || y, key = a + ">" + b;
      if (!seen.has(key)) { seen.add(key); out.push([a, b]); }
    }
    const all = new Set(legs.flat().map(t => t.id));
    S.links[lk] = out.filter(([a, b]) => all.has(a) && all.has(b) && a !== b);
    legs.forEach((ts, i) => { if (ts.length) S.tt[`${dir}:${i}:${day}`] = ts; });
  }
}
function defaultState() {
  const tt = genSample(), sample = {};
  for (const k of Object.keys(tt)) sample[k] = true;
  const xf = {};
  for (const dir of ["out", "in"]) for (const st of DEFAULT_ROUTE.stations.slice(1, -1))
    xf[`${dir}:${st}`] = { normal: 180, hurry: 135, prov: true };
  return { v: 1, tt, links: {}, sample, xf, pos: {}, ui: { dir: "out", view: "search", mode: "dep", day: "auto", relax: false, ttLeg: 0, ttDay: "wd" } };
}

/* ===== 保存 ===== */
const STORE_KEY = "tsugaku-diya-v1";
let S;
try { S = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { S = null; }
if (!S || S.v !== 1) S = defaultState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ===== 検索 ===== */
function legTrips(dir, i, day) {
  return (S.tt[`${dir}:${i}:${day}`] || [])
    .map(r => ({ d: toSec(r.d), a: toSec(r.a), t: r.t || "", to: r.to || "", id: r.id || "" }))
    .filter(r => !isNaN(r.d) && !isNaN(r.a) && r.a >= r.d)
    .sort((x, y) => x.d - y.d);
}
// legs[i] = 区間 i の列車。from[i] = 区間 i+1 の列車ID → 直通してくる区間 i の列車ID
function buildLegs(dir, day) {
  const n = legCount();
  const legs = [...Array(n).keys()].map(i => legTrips(dir, i, day));
  const from = legs.slice(1).map(() => new Map());
  const where = new Map();
  legs.forEach((ts, i) => ts.forEach(t => where.set(t.id, i)));
  for (const [a, b] of (S.links || {})[`${dir}:${day}`] || []) {
    const i = where.get(a);
    if (i !== undefined && where.get(b) === i + 1) from[i].set(b, a);
  }
  return { legs, from };
}
function getXf(rec, hurry) { return hurry && typeof rec.hurry === "number" ? rec.hurry : rec.normal; }
function transferSecs(dir, hurry) {
  const { stations } = route(dir);
  return stations.slice(1, -1).map(st => getXf(S.xf[`${dir}:${st}`], hurry));
}
function runFrom({ legs, from }, xf, start) {
  let cur = [{ trip: start, prev: null, thr: 0, through: false, slack: null }];
  for (let i = 1; i < legs.length; i++) {
    const byId = new Map(); let best = null;
    for (const e of cur) {
      if (e.trip.id) byId.set(e.trip.id, e);
      const r = e.trip.a + xf[i - 1];
      if (!best || r < best.r) best = { r, e };
    }
    const next = [];
    for (const t of legs[i]) {
      if (best && t.d > best.r + 7200) break;
      const p = byId.get(from[i - 1].get(t.id));
      if (p) next.push({ trip: t, prev: p, thr: p.thr + 1, through: true, slack: null });
      else if (best && t.d >= best.r) next.push({ trip: t, prev: best.e, thr: best.e.thr, through: false, slack: t.d - best.r });
    }
    if (!next.length) return null;
    cur = next;
  }
  let f = null;
  for (const e of cur) if (!f || e.trip.a < f.trip.a || (e.trip.a === f.trip.a && (e.thr > f.thr || (e.thr === f.thr && e.trip.d > f.trip.d)))) f = e;
  const chain = [];
  for (let e = f; e; e = e.prev) chain.unshift(e);
  // 乗換の余裕は実際に選んだ前の列車から計算し直す
  for (let i = 1; i < chain.length; i++) if (!chain[i].through) chain[i].slack = chain[i].trip.d - (chain[i - 1].trip.a + xf[i - 1]);
  return chain;
}
// a〜b は使う区間の範囲（dir の向きで数えた区間番号、b は含まない）
function search(dir, day, mode, qSec, hurry, a = 0, b = legCount()) {
  const all = buildLegs(dir, day);
  const built = { legs: all.legs.slice(a, b), from: all.from.slice(a, b - 1) }, legs = built.legs;
  if (legs.some(l => !l.length)) return { error: "時刻表が入っていない区間があります。" };
  const xf = transferSecs(dir, hurry).slice(a, b - 1);
  let cands;
  if (mode === "dep") cands = legs[0].filter(t => t.d >= qSec).slice(0, 14);
  else cands = legs[0].filter(t => t.d <= qSec && t.d >= qSec - 4 * 3600);
  let opts = cands.map(t => runFrom(built, xf, t)).filter(Boolean);
  if (mode === "arr") opts = opts.filter(c => c[c.length - 1].trip.a <= qSec);
  // 後に出ても同じ時刻に着く案は、早く出る案を消す
  const keep = []; let minArr = Infinity;
  for (let i = opts.length - 1; i >= 0; i--) { const a = opts[i][opts[i].length - 1].trip.a; if (a < minArr) { keep.unshift(opts[i]); minArr = a; } }
  const list = mode === "dep" ? keep.slice(0, 4) : keep.slice(-4).reverse();
  return { list, xf };
}

/* ===== 描画 ===== */
const $ = s => document.querySelector(s);
let liveTimer = null, toastTimer = null;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }
function nowService() {
  const d = new Date();
  let sec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const date = new Date(d);
  if (d.getHours() < 3) { sec += 86400; date.setDate(date.getDate() - 1); }
  return { sec, date };
}
// 「現在時刻」モードでは、検索を押した（または開いた）ときの時刻で検索する
let liveSnap = nowService();
const searchNow = () => S.ui.qTime ? nowService() : liveSnap;
function currentDay() { return S.ui.day === "auto" ? dayTypeOf(searchNow().date) : S.ui.day; }
function posText(dir, i) {
  const p = S.pos[`${dir}:${i}`];
  if (!p || (!p.car && !p.door && !p.note)) return `<span class="pos unset">乗車位置 未設定</span>`;
  const main = [p.car ? `<b>${esc(p.car)}</b>号車` : "", p.door ? `<b>${esc(p.door)}</b>番ドア` : ""].filter(Boolean).join(" ");
  return `<span class="pos">乗車位置 ${main}${p.note ? `<span class="hint">${esc(p.note)}</span>` : ""}</span>`;
}

/* ===== 検索の出発駅・到着駅（路線図） ===== */
// 駅の番号は常に行きの並び（左端が家側、右端が大学側）。from > to なら帰りの向き
// 開いたときは 3〜16時なら行き（大学へ）、それ以外は帰り（家へ）
function defaultSel() { const h = new Date().getHours(), n = baseRoute().stations.length; return h >= 3 && h < 16 ? { from: 0, to: n - 1, n } : { from: n - 1, to: 0, n }; }
let qSel = defaultSel();
function mapPos() {
  // 点の間隔はふだんの所要時間に比例（短い区間もつまめるように最低幅をとる）
  const r = baseRoute(), n = r.stations.length - 1;
  const w = [...Array(n).keys()].map(i => {
    const ts = legTrips("out", i, "wd"), v = ts.map(t => t.a - t.d).sort((x, y) => x - y);
    return v.length ? v[v.length >> 1] : 600;
  });
  const tot = w.reduce((x, y) => x + y, 0) || 1, ww = w.map(x => Math.max(x, tot * .09)), t2 = ww.reduce((x, y) => x + y, 0);
  const pos = [0]; ww.forEach(x => pos.push(pos[pos.length - 1] + x / t2));
  return pos;
}
const canStop = i => { const r = baseRoute(); return i === 0 || i === r.stations.length - 1 || !(r.through || []).includes(r.stations[i]); };
function renderMap() {
  const st = baseRoute().stations, pos = mapPos(), pct = x => `${(x * 100).toFixed(3)}%`;
  $("#q-map").innerHTML = `<div class="rm-inner">
    <div class="rm-arrow"><i class="tail"></i><i class="head"></i></div>
    <div class="rm-line"></div>
    ${st.map((s, i) => `<span class="rm-node${canStop(i) ? "" : " thru"}" style="left:${pct(pos[i])}" title="${esc(s)}"></span>`).join("")}
    <button type="button" class="rm-bub" data-end="from"><span></span><i></i></button>
    <button type="button" class="rm-bub" data-end="to"><span></span><i></i></button>
  </div>`;
  updateMap();
}
// 要素は作り直さずに、選んだ駅に合わせて表示だけ更新する（ドラッグ中も呼ぶ）
function updateMap() {
  const st = baseRoute().stations, pos = mapPos(), { from, to } = qSel, pct = x => `${(x * 100).toFixed(3)}%`;
  $("#q-from").textContent = st[from];
  $("#q-to").textContent = st[to];
  const inner = $("#q-map .rm-inner"); if (!inner) return;
  const lo = Math.min(from, to), hi = Math.max(from, to), ar = inner.querySelector(".rm-arrow");
  ar.className = `rm-arrow ${from < to ? "east" : "west"}`;
  ar.style.left = pct(pos[lo]); ar.style.width = pct(pos[hi] - pos[lo]);
  inner.querySelectorAll(".rm-node").forEach((n, i) => n.classList.toggle("sel", i === from || i === to));
  for (const k of ["from", "to"]) {
    const b = inner.querySelector(`.rm-bub[data-end="${k}"]`);
    b.querySelector("span").textContent = st[qSel[k]];
    b.setAttribute("aria-label", `${k === "from" ? "出発駅" : "到着駅"} ${st[qSel[k]]}（左右にドラッグで変更）`);
  }
  placeBubbles();
}
function placeBubbles() {
  const inner = $("#q-map .rm-inner"); if (!inner) return;
  const W = inner.clientWidth, pos = mapPos();
  const bubs = ["from", "to"].map(k => ({ k, el: inner.querySelector(`.rm-bub[data-end="${k}"]`), x: pos[qSel[k]] * W }));
  bubs.forEach(b => { b.w = b.el.offsetWidth; b.l = Math.max(0, Math.min(W - b.w, b.x - b.w / 2)); });
  // 2つが重なるときは左右に押し分ける
  const [L, Rr] = bubs[0].x <= bubs[1].x ? bubs : [bubs[1], bubs[0]];
  const gap = 4;
  if (L.l + L.w + gap > Rr.l) {
    const mid = (L.x + Rr.x) / 2;
    L.l = Math.max(0, Math.min(mid - L.w - gap / 2, W - L.w - Rr.w - gap));
    Rr.l = Math.min(W - Rr.w, Math.max(L.l + L.w + gap, mid + gap / 2));
  }
  for (const b of bubs) {
    b.el.style.left = `${b.l}px`;
    b.el.querySelector("i").style.left = `${Math.max(6, Math.min(b.w - 6, b.x - b.l))}px`;
  }
}
let mapDrag = null;
$("#q-map").addEventListener("pointerdown", e => {
  const b = e.target.closest(".rm-bub"); if (!b) return;
  e.preventDefault();
  mapDrag = { end: b.dataset.end, id: e.pointerId, moved: false };
  b.setPointerCapture(e.pointerId); b.classList.add("drag");
});

  if (!mapDrag || e.pointerId !== mapDrag.id) return;

  const pos = mapPos(), other = qSel[mapDrag.end === "from" ? "to" : "from"], cur = qSel[mapDrag.end];
  // 相手を追い越さず、最低1区間あける。止まれるのは乗換駅と両端だけ
  let best = cur, bd = Infinity;

// v1: { tt }（隣の区間と同じidで直通）／ v2: { route, tt（列車ID付き）, links }
function sameRoute(a, b) { return JSON.stringify(a.stations) === JSON.stringify(b.stations); }
function applyPack(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { return "JSONとして読めませんでした。ファイルを確認してください。"; }
  if (!d || d.kind !== "tsugaku-pack" || !d.tt) return "時刻表パックの形式ではありません。";
  if (d.route) {
    const r = d.route;
    if (!Array.isArray(r.stations) || !Array.isArray(r.lines) || r.lines.length !== r.stations.length - 1) return "パックの経路が読めません。";
    const changed = !S.needRoute && !sameRoute(r, baseRoute());
    delete S.needRoute;
    S.route = { stations: r.stations, lines: r.lines.map(l => ({ name: l.name, prefix: l.prefix, ...(l.color ? { color: l.color } : {}) })), through: r.through || [] };
    if (changed) {
      // 駅が変わったら、古い経路の時刻表と乗車位置は捨てる（乗換時間は駅名が同じなら残る）
      S.tt = {}; S.sample = {}; S.links = {}; S.pos = {};
    }
    ensureXf();
  }
  const n = legCount(), done = [];
  for (const [k, trips] of Object.entries(d.tt)) {
    const m = /^(out|in):(\d+):(wd|hd)$/.exec(k);
    if (!m || +m[2] >= n || !Array.isArray(trips)) continue;
    const ok = trips.filter(t => t && !isNaN(toSec(t.d)) && !isNaN(toSec(t.a)));
    if (!ok.length) continue;
    // 置き換える区間の列車が入っていた古い対応は消す
    const old = new Set((S.tt[k] || []).map(t => t.id)), lk = `${m[1]}:${m[3]}`;
    if (S.links[lk]) S.links[lk] = S.links[lk].filter(([x, y]) => !old.has(x) && !old.has(y));
    S.tt[k] = ok; S.sample[k] = false;
    const { stations } = route(m[1]);
    done.push(`${m[1] === "out" ? "行き" : "帰り"} ${stations[+m[2]]}→${stations[+m[2] + 1]}（${m[3] === "wd" ? "平日" : "土休日"}・${ok.length}本）`);
  }
  if (!done.length) return "取り込める区間がありませんでした。";
  if (d.links) for (const [k, v] of Object.entries(d.links)) if (/^(out|in):(wd|hd)$/.test(k) && Array.isArray(v)) S.links[k] = v;
  normalizeTrains();
  save(); render();
  const nl = Object.values(S.links).reduce((a, v) => a + v.length, 0);
  return `${done.length}区間を取り込みました${d.asOf ? `（${esc(d.asOf)}現在のダイヤ）` : ""}。直通の対応は${nl}組です：<br>${done.join("<br>")}`;
}

  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { $("#pk-result").innerHTML = applyPack(r.result); e.target.value = ""; };
  r.readAsText(f);
};
$("#pk-apply").onclick = () => { $("#pk-result").innerHTML = applyPack($("#pk-text").value); $("#pk-text").value = ""; };

$("#bk-reset").onclick = () => {
  $("#bk-confirm").innerHTML = `<div class="confirm">取り込んだ時刻表と実測値がすべて消えます。<button id="bk-reset-yes" class="btn danger small" type="button">消してサンプルに戻す</button><button id="bk-reset-no" class="btn small" type="button">やめる</button></div>`;
  $("#bk-reset-yes").onclick = () => { const ui = S.ui; S = defaultState(); S.ui = ui; migrate(); save(); $("#bk-confirm").innerHTML = ""; render(); toast("サンプルに戻しました"); };
  $("#bk-reset-no").onclick = () => $("#bk-confirm").innerHTML = "";
};

/* ===== 起動 ===== */
fromHash();
setInterval(() => {
  if (S.ui.view !== "search" || S.ui.qTime) return;
  tickCountdown();
}, 1000);
</script>
